<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Treino de redação ENEM com avaliação experimental por IA e correção humana independente."><title>Redator — treino ENEM</title>
<style>
:root{--ink:#172033;--muted:#647089;--line:#dce3ef;--paper:#fff;--bg:#f5f7fb;--brand:#3156d3;--brand2:#233b91;--soft:#edf1ff;--ok:#137353;--warn:#986514;--danger:#b3261e;--shadow:0 16px 42px #26365c12}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#15224a;color:#fff;padding:28px 20px;position:sticky;top:0;height:100vh}.brand{font-size:1.35rem;font-weight:850;margin-bottom:34px}.brand small{display:block;font-size:.72rem;color:#b9c7f8;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#d8e0ff;text-align:left;padding:12px;border-radius:10px}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.runtime{position:absolute;bottom:24px;left:20px;right:20px;font-size:.75rem;color:#cbd5ff;border-top:1px solid #ffffff24;padding-top:14px}.main{padding:34px;max-width:1280px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.top h1{margin:0;font-size:clamp(1.7rem,3vw,2.5rem);line-height:1.15}.top p{margin:7px 0 0;color:var(--muted)}.pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--soft);color:var(--brand2);font-size:.78rem;font-weight:750}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.card h2,.card h3{margin-top:0}.span8{grid-column:span 8}.span4{grid-column:span 4}.span12{grid-column:span 12}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-weight:750}.field small,.hint{color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 13px;color:var(--ink)}textarea{min-height:250px;resize:vertical}input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #7894ff55;outline-offset:2px}.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap}.tab,.btn{border:1px solid var(--line);border-radius:10px;padding:10px 15px;background:#fff;color:var(--ink);font-weight:750}.tab.active{background:var(--soft);border-color:#a9b8f5;color:var(--brand2)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.secondary{background:var(--soft);border-color:transparent;color:var(--brand2)}.btn:disabled{opacity:.55;cursor:not-allowed}.proposal{background:#f8faff;border-left:4px solid var(--brand);padding:14px 16px;border-radius:8px;margin-bottom:18px}.drop{display:block;border:2px dashed #b9c5db;padding:28px;text-align:center;border-radius:14px;color:var(--muted);background:#fafcff}.steps{display:flex;margin:16px 0 24px}.step{flex:1;color:var(--muted);font-size:.82rem;font-weight:750;position:relative;padding-top:15px}.step:before{content:"";position:absolute;top:0;left:0;right:8px;height:5px;border-radius:5px;background:#dfe5f0}.step.done:before,.step.current:before{background:var(--brand)}.step.current{color:var(--brand2)}.timer{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:800}.competences{display:grid;gap:12px}.competence{border:1px solid var(--line);border-radius:14px;padding:17px}.comp-head{display:flex;justify-content:space-between;gap:10px}.score{font-size:1.15rem;font-weight:850;color:var(--brand2)}.bar{height:8px;background:#e8ecf4;border-radius:99px;overflow:hidden;margin:12px 0}.bar span{display:block;height:100%;background:var(--brand)}.evidence{border-left:3px solid #9dacdb;padding-left:12px;color:#39455c}.total{font-size:2.2rem;font-weight:900;color:var(--brand2)}.attempt{display:grid;grid-template-columns:52px 1fr auto;gap:15px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.attempt:last-child{border-bottom:0}.attempt-no{height:44px;width:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:850;color:var(--brand2)}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:.8rem;color:var(--muted)}.chart{display:flex;align-items:flex-end;gap:14px;height:220px;padding:22px 10px 28px;border-bottom:1px solid var(--line)}.chart-col{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:4px;height:100%;position:relative}.chart-bar{width:28px;min-height:2px;border-radius:7px 7px 0 0;background:var(--brand)}.chart-bar.human{background:#e19a32}.chart-label{position:absolute;bottom:-25px;font-size:.75rem;color:var(--muted)}.alert{padding:14px 16px;border-radius:12px;background:#fff4dc;color:#6d4c10;margin:14px 0}.alert.error{background:#fdeceb;color:var(--danger)}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hidden{display:none!important}.loading{width:26px;height:26px;border:3px solid #d9e0f4;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.review-text{white-space:pre-wrap;background:#fafbfe;border:1px solid var(--line);border-radius:12px;padding:18px;max-height:520px;overflow:auto}.priority{counter-increment:p;background:#f7f9ff;padding:14px;border-radius:12px}.priority:before{content:counter(p);display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--brand);color:#fff;margin-right:8px;font-weight:800}.priorities{counter-reset:p;display:grid;gap:10px}.diagnostic{font-size:.8rem;color:var(--muted);margin-top:20px}details summary{cursor:pointer;font-weight:700}.toast{position:fixed;right:24px;bottom:24px;max-width:420px;background:#172033;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:10}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:18px}.brand{margin-bottom:14px}.nav{display:flex;overflow:auto}.runtime{position:static;margin-top:12px}.main{padding:20px}.span8,.span4{grid-column:span 12}.split{grid-template-columns:1fr}.top{display:block}.top .pill{margin-top:12px}.attempt{grid-template-columns:46px 1fr}.attempt .actions{grid-column:2}.step{min-width:120px}.steps{overflow:auto}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">Redator<small>Treino ENEM</small></div><nav class="nav" aria-label="Navegação principal"><button data-route="new">＋ Nova redação</button><button data-route="essays">Minhas redações</button><button data-route="progress">Meu progresso</button><button data-route="reviewer">Correções pendentes</button></nav><div id="runtime" class="runtime" aria-live="polite">Verificando o runtime…</div></aside><main id="app" class="main" tabindex="-1"></main></div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<style>.drop.dragging{border-color:var(--brand);background:var(--soft)}.file-preview{display:block;max-width:100%;max-height:320px;margin:12px auto;border:1px solid var(--line);border-radius:10px}</style>
<script>
const state={runtime:null,themes:[],essay:null,result:null,timer:null};const app=document.querySelector('#app'),toast=document.querySelector('#toast');const names={C1:'Escrita formal',C2:'Tema e repertório',C3:'Argumentação',C4:'Coesão',C5:'Proposta de intervenção'};const descriptions={C1:'Domínio da escrita formal da língua portuguesa.',C2:'Compreensão da proposta e repertório pertinente.',C3:'Seleção, organização e desenvolvimento de argumentos.',C4:'Recursos linguísticos que conectam a argumentação.',C5:'Proposta articulada e respeito aos direitos humanos.'};
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const fmt=v=>v?new Date(v).toLocaleString('pt-BR'):'—';const api=async(path,opts={})=>{const r=await fetch('/api'+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let data={};try{data=await r.json()}catch{}if(!r.ok){const e=new Error(data.error||`Erro HTTP ${r.status}`);e.code=data.code;e.runId=data.runId;e.status=r.status;throw e}return data};function notify(message){toast.textContent=message;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),4500)}function head(title,subtitle,badge='Piloto local'){return `<header class="top"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><span class="pill">${esc(badge)}</span></header>`}function setRoute(route){location.hash=route}function route(){return location.hash.replace(/^#/,'')||'new'}
async function bootstrap(){document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>setRoute(b.dataset.route));try{state.runtime=await api('/runtime');document.querySelector('#runtime').innerHTML=`<strong>${esc(state.runtime.provider)} · ${esc(state.runtime.model)}</strong><br>${state.runtime.provider==='fake'?'Demonstração simulada':'LLM local experimental'}`}catch{document.querySelector('#runtime').textContent='IA indisponível'}try{state.themes=await api('/temas')}catch(e){notify(e.message)}render()}window.addEventListener('hashchange',render);function render(){document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',route().startsWith(b.dataset.route)));clearInterval(state.timer);const r=route();if(r.startsWith('new'))return renderNew();if(r==='essays')return renderEssays();if(r==='progress')return renderProgress();if(r==='reviewer')return renderReviewer();if(r.startsWith('inspect/'))return renderInspect(+r.split('/')[1]);if(r.startsWith('result/'))return renderResult(+r.split('/')[1]);if(r.startsWith('improve/'))return renderImprove(+r.split('/')[1]);if(r.startsWith('attempts/'))return renderAttempts(+r.split('/')[1]);setRoute('new')}
function renderNew(){const draft=JSON.parse(localStorage.getItem('redator-draft')||'{}'),parentId=new URLSearchParams(location.hash.split('?')[1]||'').get('parent');app.innerHTML=head(parentId?'Reescrever redação':'Nova redação','Informe o tema e preserve sua versão antes de pedir a avaliação.')+`<div class="grid"><section class="card span8"><div class="field"><label for="theme">Tema obrigatório</label><select id="theme"><option value="">Selecione…</option>${state.themes.map(t=>`<option value="${t.id}" ${String(draft.temaId)===String(t.id)?'selected':''}>${esc(t.titulo)}</option>`).join('')}</select></div><div id="proposal" class="proposal hidden"></div><div class="field"><label for="title">Título <span class="hint">(opcional)</span></label><input id="title" value="${esc(draft.title||'')}"></div><div class="tabs"><button class="tab active" data-source="text">Digitar texto</button><button class="tab" data-source="image">Enviar imagem</button><button class="tab" data-source="pdf">Enviar PDF</button></div><div id="textPane" class="field" style="margin-top:16px"><label for="essayText">Texto da redação</label><textarea id="essayText">${esc(draft.text||'')}</textarea></div><div id="filePane" class="hidden" style="margin-top:16px"><label class="drop" for="file">Selecione seu documento<br><small>PDF, PNG ou JPEG</small><input id="file" type="file" accept=".pdf,image/png,image/jpeg" class="sr-only"></label><p id="fileName" class="hint"></p><div class="field"><label for="transcribed">Transcrição inicial</label><textarea id="transcribed" placeholder="Cole ou confira aqui o texto extraído."></textarea></div></div><div class="actions"><button id="continue" class="btn primary">Continuar para inspeção</button></div></section><aside class="card span4"><h2>Antes de continuar</h2><p>Texto digitado pode ser avaliado diretamente. Imagens e PDFs exigem conferência da transcrição.</p><p class="hint">Uma reescrita cria outra tentativa e nunca substitui versões anteriores.</p></aside></div>`;const theme=document.querySelector('#theme'),proposal=document.querySelector('#proposal');function showTheme(){const t=state.themes.find(x=>String(x.id)===theme.value);proposal.classList.toggle('hidden',!t);if(t)proposal.innerHTML=`<strong>${esc(t.recorte)}</strong><br>${esc(t.motivadores)}`}theme.onchange=()=>{saveDraft();showTheme()};showTheme();let source='text';document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{source=b.dataset.source;document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#textPane').classList.toggle('hidden',source!=='text');document.querySelector('#filePane').classList.toggle('hidden',source==='text')});document.querySelector('#file').onchange=e=>document.querySelector('#fileName').textContent=e.target.files[0]?.name||'';document.querySelector('#essayText').oninput=saveDraft;document.querySelector('#title').oninput=saveDraft;function saveDraft(){localStorage.setItem('redator-draft',JSON.stringify({temaId:theme.value,title:document.querySelector('#title').value,text:document.querySelector('#essayText').value}))}document.querySelector('#continue').onclick=async()=>{const text=source==='text'?document.querySelector('#essayText').value:document.querySelector('#transcribed').value;if(!theme.value||!text.trim())return notify('Informe o tema e o texto da redação.');try{const data=await api('/attempts',{method:'POST',body:JSON.stringify({temaId:+theme.value,text,title:document.querySelector('#title').value,parentEssayId:parentId?+parentId:null,sourceType:source})});localStorage.removeItem('redator-draft');setRoute(`inspect/${data.essay.id}`)}catch(e){notify(e.message)}}}
async function renderInspect(id){app.innerHTML=head('Inspecionar e acompanhar','Confira a versão antes da avaliação.')+`<section class="card"><div class="loading"></div></section>`;try{const e=await api(`/essays/${id}`),needs=e.status==='NEEDS_REVIEW';state.essay=e;app.innerHTML=head(`Tentativa ${e.attempt_number||1}`,e.theme.titulo,needs?'Conferência necessária':'Texto pronto')+`<div class="steps"><div class="step ${needs?'current':'done'}">Texto confirmado</div><div class="step">Avaliação em andamento</div><div class="step">Resultado disponível</div></div><div class="grid"><section class="card span8"><div class="proposal"><strong>${esc(e.theme.recorte)}</strong><br>${esc(e.theme.motivadores)}</div><div class="field"><label for="reviewText">${needs?'Confira a transcrição':'Texto da tentativa'}</label><textarea id="reviewText" ${needs?'':'readonly'}>${esc(e.text)}</textarea></div>${needs?'<label><input id="confirmed" type="checkbox"> Conferi: o texto corresponde ao que escrevi</label>':''}<div class="actions" style="margin-top:18px">${needs?'<button id="approve" class="btn primary">Confirmar texto e avaliar</button>':'<button id="evaluate" class="btn primary">Avaliar com IA</button>'}<button id="humanNow" class="btn secondary">Solicitar correção humana</button></div></section><aside class="card span4"><h2>O que acontece agora</h2><p>A IA faz uma única geração estruturada para C1–C5. Nenhuma nota parcial é publicada.</p><p class="hint">Ao voltar, consultaremos o estado persistido.</p></aside></div>`;if(needs)document.querySelector('#approve').onclick=async()=>{if(!document.querySelector('#confirmed').checked)return notify('Confirme que revisou a transcrição.');try{const r=await api(`/essays/${id}/review`,{method:'POST',body:JSON.stringify({reviewedText:document.querySelector('#reviewText').value,approved:true})});if(r.status!=='READY')return notify('A transcrição ainda não passou pela conferência de qualidade.');startEvaluation(id)}catch(x){notify(x.message)}};else document.querySelector('#evaluate').onclick=()=>startEvaluation(id);document.querySelector('#humanNow').onclick=()=>requestHuman(id,null)}catch(e){showError(e)}}
async function startEvaluation(id){app.innerHTML=head('Avaliando sua redação','Analisando pelas cinco competências.','Avaliação por IA · experimental')+`<div class="steps"><div class="step done">Texto confirmado</div><div class="step current">Avaliação em andamento</div><div class="step">Resultado disponível</div></div><section class="card"><div style="display:flex;gap:16px;align-items:center"><div class="loading"></div><div><strong>Analisando sua redação pelas cinco competências</strong><div id="timer" class="timer">00:00</div></div></div><p class="hint">C1 escrita formal · C2 tema e repertório · C3 argumentação · C4 coesão · C5 intervenção</p></section>`;const started=Date.now();state.timer=setInterval(()=>{const s=Math.floor((Date.now()-started)/1000),el=document.querySelector('#timer');if(el)el.textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);let polling=true;const poll=setInterval(async()=>{if(!polling)return;try{const r=await api(`/essays/${id}/result`);if(!['NOT_EVALUATED','RUNNING'].includes(r.status)){polling=false;clearInterval(poll);state.result=r;setRoute(`result/${id}`)}}catch{}},4000);try{state.result=await api(`/essays/${id}/evaluate?profile=normal`,{method:'POST'});polling=false;clearInterval(poll);setRoute(`result/${id}`)}catch(e){polling=false;clearInterval(poll);showEvaluationError(id,e)}}
function showEvaluationError(id,e){clearInterval(state.timer);app.innerHTML=head('Avaliação não concluída','Nenhuma nota foi fabricada.')+`<section class="card"><div class="alert error"><strong>${esc(e.code||'Falha')}</strong><br>${esc(e.message)}</div><div class="actions"><button class="btn secondary" onclick="setRoute('inspect/${id}')">Voltar</button><button class="btn" onclick="requestHuman(${id},${e.runId||'null'})">Solicitar correção humana</button></div></section>`}
function splitField(v){return Array.isArray(v)?v:String(v||'').split(' | ').filter(Boolean)}function normalizeCompetences(v){if(Array.isArray(v))return v.map(c=>({...c,evidencias:splitField(c.evidencias),problemas:splitField(c.problemas),motivos:splitField(c.motivos)}));return Object.values(v||{})}function competenceCard(c,blocked){const k=c.competencia;return `<article class="competence"><div class="comp-head"><div><strong>${esc(k)} — ${esc(names[k]||k)}</strong><div class="hint">${esc(descriptions[k]||'')}</div></div><span class="score">${blocked?'provisória: ':''}${esc(c.nota)} / 200</span></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,(+c.nota||0)/2))}%"></span></div>${(c.evidencias||[]).map(x=>`<p class="evidence">“${esc(x)}”</p>`).join('')}${(c.problemas||[]).map(x=>`<p>• ${esc(x)}</p>`).join('')}${(c.motivos||[]).map(x=>`<p class="hint">${esc(x)}</p>`).join('')}</article>`}
function humanComparison(h,r){if(!h.evaluation)return'';const ai=Object.fromEntries(normalizeCompetences(r.competences).map(c=>[c.competencia,c.nota])),scores=h.evaluation.scores||{},comments=h.evaluation.comments||{};return `<hr><h3>IA × Humano</h3><p><strong>${r.total??'—'}</strong> IA · <strong>${h.evaluation.total??'—'}</strong> humano</p><div class="table-wrap"><table aria-label="Comparação por competência"><thead><tr><th>Competência</th><th>IA</th><th>Humano</th><th>Comentário humano</th></tr></thead><tbody>${Object.keys(names).map(c=>`<tr><td><strong>${c}</strong> — ${esc(names[c])}</td><td>${ai[c]??'—'}</td><td>${scores[c]??'—'}</td><td>${esc(comments[c]||'—')}</td></tr>`).join('')}</tbody></table></div>${h.evaluation.mainGuidance?`<h4>Orientação principal</h4><p>${esc(h.evaluation.mainGuidance)}</p>`:''}<p class="hint">As correções são independentes; divergências são exibidas para estudo e não geram média automática.</p>`}
async function renderResult(id){app.innerHTML=head('Resultado','Recuperando o resultado persistido…')+`<section class="card"><div class="loading"></div></section>`;try{const [e,r,h]=await Promise.all([api(`/essays/${id}`),state.result&&String(state.result.essayId)===String(id)?state.result:api(`/essays/${id}/result`),api(`/essays/${id}/human-review-request`)]);state.result=r;if(['RUNNING','NOT_EVALUATED'].includes(r.status))return renderInspect(id);const blocked=r.status!=='READY',cs=normalizeCompetences(r.competences);app.innerHTML=head(`Tentativa ${e.attempt_number||1}`,e.theme.titulo,r.provider==='fake'?'Demonstração — resultado simulado':'Avaliação por IA · experimental')+`${blocked?`<div class="alert"><strong>Esta redação precisa de revisão.</strong><br>${esc((r.reviewReasons||[]).join(' · ')||r.failureMessage||'A nota não está disponível.')}</div>`:''}<div class="grid"><section class="card span8"><div class="competences">${cs.map(c=>competenceCard(c,blocked)).join('')}</div>${!blocked?`<div style="margin-top:22px"><span class="hint">Total fornecido pelo servidor</span><div class="total">${esc(r.total)} / 1000</div></div>`:''}</section><aside class="card span4"><h2>Próximos passos</h2><div class="actions" style="display:grid"><button class="btn primary" onclick="setRoute('improve/${id}')">Quero melhorar minha redação</button><button id="requestHuman" class="btn secondary" ${h.status?'disabled':''}>${h.status?'Correção humana '+humanStatus(h.status):'Solicitar correção humana'}</button><button class="btn" onclick="setRoute('attempts/${e.group_id}')">Ver minhas tentativas</button></div>${humanComparison(h,r)}<details class="diagnostic"><summary>Diagnóstico técnico</summary><pre>${esc(JSON.stringify({runId:r.runId,provider:r.provider,model:r.model,status:r.status},null,2))}</pre></details></aside></div>`;const b=document.querySelector('#requestHuman');if(b&&!b.disabled)b.onclick=()=>requestHuman(id,r.runId)}catch(e){showError(e)}}function humanStatus(s){return({REQUESTED:'solicitada',IN_REVIEW:'em correção',COMPLETED:'concluída'})[s]||s}async function requestHuman(id,runId){try{await api(`/essays/${id}/human-review-requests`,{method:'POST',body:JSON.stringify(runId?{runId}:{})});notify('Correção humana solicitada.');setRoute(`result/${id}`)}catch(e){notify(e.message)}}
async function renderImprove(id){app.innerHTML=head('Plano de melhoria','Organizando os achados sem chamar o modelo novamente.')+`<section class="card"><div class="loading"></div></section>`;try{const [e,r]=await Promise.all([api(`/essays/${id}`),api(`/essays/${id}/result`)]),cs=normalizeCompetences(r.competences),priorities=[...cs].sort((a,b)=>a.nota-b.nota).slice(0,3);app.innerHTML=head('Plano de melhoria',`Tentativa ${e.attempt_number||1} · ${e.theme.titulo}`)+`<div class="grid"><section class="card span8"><h2>Por onde começar</h2><div class="priorities">${priorities.map(c=>`<div class="priority"><strong>${esc(c.competencia)} — ${esc(names[c.competencia])}</strong><br>${esc(c.problemas?.[0]||'Revise o descritor e confira seu texto.')}</div>`).join('')}</div><h2 style="margin-top:28px">Detalhes</h2>${cs.map(c=>`<details class="competence"><summary>${esc(c.competencia)} — ${esc(names[c.competencia])}</summary><h4>Trecho analisado</h4>${c.evidencias?.length?c.evidencias.map(x=>`<p class="evidence">“${esc(x)}”</p>`).join(''):'<p class="hint">Sem trecho associado.</p>'}<h4>Por que recebeu esta nota</h4>${(c.motivos||[]).map(x=>`<p>${esc(x)}</p>`).join('')||'<p class="hint">Sem justificativa adicional.</p>'}<h4>O que melhorar</h4>${(c.problemas||[]).map(x=>`<p>• ${esc(x)}</p>`).join('')||'<p>Continue praticando.</p>'}<h4>Como praticar</h4><p class="hint">Orientação geral: releia o descritor, localize o ponto no texto e reescreva-o com maior clareza. Isto não é uma nova avaliação.</p></details>`).join('')}</section><aside class="card span4"><h2>Próxima versão</h2><p>A nova tentativa será avaliada de forma independente.</p><div class="actions" style="display:grid"><button class="btn primary" onclick="location.hash='new?parent=${id}'">Reescrever e enviar novamente</button><button class="btn" onclick="setRoute('result/${id}')">Voltar ao resultado</button></div></aside></div>`}catch(e){showError(e)}}
async function renderEssays(){app.innerHTML=head('Minhas redações','Histórico preservado.')+`<section class="card"><div class="loading"></div></section>`;try{const groups=await api('/me/essays');app.innerHTML=head('Minhas redações','Tentativas agrupadas por tema e histórico preservado.')+(groups.length?`<section class="card">${groups.map(g=>`<article class="attempt"><div class="attempt-no">${esc(g.attempts)}</div><div><strong>${esc(g.theme)}</strong><div class="hint">${fmt(g.lastActivity)} · IA ${g.latestAiTotal??'—'} · Humano ${g.latestHumanTotal??'—'}</div></div><button class="btn secondary" onclick="setRoute('attempts/${g.groupId}')">Abrir</button></article>`).join('')}</section>`:`<section class="card empty"><h2>Você ainda não enviou uma redação.</h2><button class="btn primary" onclick="setRoute('new')">Começar agora</button></section>`)}catch(e){showError(e)}}async function renderAttempts(group){app.innerHTML=head('Tentativas','Carregando versões…')+`<section class="card"><div class="loading"></div></section>`;try{const rows=await api(`/me/essays/${group}/attempts`);app.innerHTML=head(rows[0]?.theme||'Tentativas','Cada versão permanece imutável depois da avaliação.')+`<section class="card">${rows.map((r,i)=>`<article class="attempt"><div class="attempt-no">${r.attemptNumber}</div><div><strong>${esc(r.title||`Tentativa ${r.attemptNumber}`)}</strong><div class="hint">${fmt(r.createdAt)} · IA ${r.aiTotal??'—'} · Humano ${r.humanTotal??'—'} · ${esc(r.status)}</div></div><div class="actions"><button class="btn secondary" onclick="setRoute('result/${r.id}')">Abrir</button>${i===rows.length-1?`<button class="btn" onclick="location.hash='new?parent=${r.id}'">Reescrever</button>`:''}</div></article>`).join('')}</section>`}catch(e){showError(e)}}
function progressScore(point,competence,human=false){if(competence==='total')return human?point.human?.total:point.total;const scores=human?point.human?.scores:point.scores;if(Array.isArray(scores))return scores.find(s=>s.competencia===competence)?.nota;return scores?.[competence]}
function progressView(points,competence){const label=competence==='total'?'Nota total':`${competence} — ${names[competence]}`,max=competence==='total'?1000:200,latestGroup=points.at(-1)?.groupId,same=points.filter(p=>p.groupId===latestGroup),first=same[0],last=same.at(-1),configs=new Set(points.map(p=>`${p.provider||'—'} · ${p.model||'—'}`));return `<div class="grid"><section class="card span12"><h2>Nesta redação</h2>${same.length>1?`<p class="hint">Primeira e mais recente tentativa do tema “${esc(last.theme)}”. IA e humano permanecem separados.</p><div class="table-wrap"><table aria-label="Evolução nesta redação"><thead><tr><th>Métrica</th><th>Primeira IA</th><th>Última IA</th><th>Variação IA</th><th>Primeira humana</th><th>Última humana</th></tr></thead><tbody>${['total',...Object.keys(names)].map(c=>{const a=progressScore(first,c),b=progressScore(last,c),ha=progressScore(first,c,true),hb=progressScore(last,c,true),delta=a!=null&&b!=null?b-a:null;return `<tr><td>${c==='total'?'Total':c+' — '+esc(names[c])}</td><td>${a??'—'}</td><td>${b??'—'}</td><td>${delta==null?'—':delta>0?'+'+delta:delta}</td><td>${ha??'—'}</td><td>${hb??'—'}</td></tr>`}).join('')}</tbody></table></div><details class="diagnostic"><summary>Comparar textos da primeira e última tentativa</summary><div class="split" style="margin-top:14px"><div><strong>Primeira tentativa</strong><div class="review-text">${esc(first.text||'Texto indisponível.')}</div></div><div><strong>Última tentativa</strong><div class="review-text">${esc(last.text||'Texto indisponível.')}</div></div></div><p class="hint">A comparação é literal. A ausência de um apontamento novo não comprova que o problema foi resolvido.</p></details>`:`<p class="hint">Envie uma reescrita deste tema para comparar a primeira e a tentativa mais recente.</p>`}</section><section class="card span12"><div class="split"><div><h2>Ao longo do tempo</h2><p class="hint">${esc(label)} · azul IA, laranja humano</p>${configs.size>1?'<div class="alert"><strong>Configuração da IA mudou.</strong> Compare notas de configurações diferentes com cautela.</div>':''}</div><div class="field"><label for="progressCompetence">Filtrar competência</label><select id="progressCompetence"><option value="total">Nota total</option>${Object.keys(names).map(c=>`<option value="${c}" ${c===competence?'selected':''}>${c} — ${esc(names[c])}</option>`).join('')}</select></div></div><div class="chart">${points.map(p=>{const ai=progressScore(p,competence),human=progressScore(p,competence,true);return `<div class="chart-col">${ai!=null?`<div class="chart-bar" title="IA ${ai}" style="height:${Math.max(0,Math.min(100,ai/max*100))}%"></div>`:''}${human!=null?`<div class="chart-bar human" title="Humano ${human}" style="height:${Math.max(0,Math.min(100,human/max*100))}%"></div>`:''}<span class="chart-label">T${p.attemptNumber}</span></div>`}).join('')}</div></section><section class="card span12 table-wrap"><table aria-label="Histórico de progresso"><thead><tr><th>Tentativa</th><th>Tema</th><th>IA</th><th>Humano</th><th>Publicação humana</th><th>Configuração IA</th></tr></thead><tbody>${points.map(p=>`<tr><td>${p.attemptNumber}</td><td>${esc(p.theme)}</td><td>${progressScore(p,competence)??'—'}</td><td>${progressScore(p,competence,true)??'—'}</td><td>${fmt(p.human?.publishedAt)}</td><td>${esc((p.provider||'—')+' · '+(p.model||'—'))}</td></tr>`).join('')}</tbody></table></section></div>`}
async function renderProgress(){app.innerHTML=head('Meu progresso','IA e humano aparecem separados.')+`<section class="card"><div class="loading"></div></section>`;try{const {points}=await api('/me/progress');if(!points.length){app.innerHTML=head('Meu progresso','Resultados fake, nulos e reexecuções foram excluídos.')+`<section class="card empty"><h2>Ainda não há avaliações reais publicáveis.</h2><button class="btn primary" onclick="setRoute('new')">Enviar uma redação</button></section>`;return}const draw=competence=>{app.innerHTML=head('Meu progresso','Resultados fake, nulos e reexecuções foram excluídos.')+progressView(points,competence);document.querySelector('#progressCompetence').onchange=e=>draw(e.target.value)};draw('total')}catch(e){showError(e)}}
async function renderReviewer(){const key=sessionStorage.getItem('reviewer-key')||'';app.innerHTML=head('Correções pendentes','A nota da IA fica oculta até a publicação.','Área restrita')+`<section class="card"><div class="split"><div class="field"><label for="reviewerKey">Chave local</label><input id="reviewerKey" type="password" value="${esc(key)}"></div><div class="field"><label for="reviewerId">Identificador</label><input id="reviewerId" value="pilot-reviewer"></div></div><div class="split"><div class="field"><label for="reviewStatus">Estado da fila</label><select id="reviewStatus"><option value="REQUESTED">Solicitadas</option><option value="IN_REVIEW">Em correção</option><option value="COMPLETED">Concluídas</option></select></div><div class="field"><label>&nbsp;</label><button id="loadQueue" class="btn primary">Carregar correções</button></div></div><div id="queue"></div></section>`;document.querySelector('#loadQueue').onclick=loadQueue;document.querySelector('#reviewStatus').onchange=loadQueue}async function loadQueue(){const key=document.querySelector('#reviewerKey').value,id=document.querySelector('#reviewerId').value||'pilot-reviewer',status=document.querySelector('#reviewStatus').value;sessionStorage.setItem('reviewer-key',key);try{const rows=await api(`/reviewer/review-requests?status=${status}`,{headers:{'X-Reviewer-Key':key}});document.querySelector('#queue').innerHTML=rows.length?rows.map(r=>`<article class="attempt"><div class="attempt-no">${r.attemptNumber}</div><div><strong>${esc(r.theme)}</strong><div class="hint">${fmt(r.requestedAt)} · ${humanStatus(r.status||status)}</div></div>${status==='REQUESTED'?`<button class="btn secondary" data-claim="${r.id}">Assumir</button>`:status==='IN_REVIEW'?`<button class="btn secondary" data-continue="${r.id}">Continuar</button>`:'<span class="pill">Publicada</span>'}</article>`).join(''):`<div class="empty">Nenhuma correção ${status==='REQUESTED'?'solicitada':status==='IN_REVIEW'?'em andamento':'concluída'}.</div>`;document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=async()=>{try{await api(`/reviewer/review-requests/${b.dataset.claim}/claim`,{method:'POST',headers:{'X-Reviewer-Key':key,'X-Reviewer-Id':id}});renderCorrection(+b.dataset.claim,key,id)}catch(e){notify(e.message)}});document.querySelectorAll('[data-continue]').forEach(b=>b.onclick=()=>renderCorrection(+b.dataset.continue,key,id))}catch(e){notify(e.message)}}
async function renderCorrection(requestId,key,id){try{const r=await api(`/reviewer/review-requests/${requestId}`,{headers:{'X-Reviewer-Key':key,'X-Reviewer-Id':id}}),saved=r.draft||{},savedScores=saved.scores||{},savedComments=saved.comments||{};app.innerHTML=head('Correção independente',r.theme,'IA oculta até publicar')+`<div class="grid"><section class="card span8"><div class="proposal"><strong>${esc(r.recorte)}</strong><br>${esc(r.motivadores)}</div><div class="review-text">${esc(r.text)}</div></section><aside class="card span4"><h2>Notas C1–C5</h2>${saved.savedAt?`<p class="hint">Rascunho recuperado · ${fmt(saved.savedAt)}</p>`:''}${Object.keys(names).map(c=>`<div class="field"><label>${c}</label><select id="score-${c}"><option value="">—</option>${[0,40,80,120,160,200].map(n=>`<option value="${n}" ${Number(savedScores[c])===n?'selected':''}>${n}</option>`).join('')}</select><textarea id="comment-${c}" placeholder="Justificativa" style="min-height:70px">${esc(savedComments[c]||'')}</textarea></div>`).join('')}<div class="field"><label for="guidance">Orientação principal</label><textarea id="guidance" style="min-height:90px">${esc(saved.mainGuidance||'')}</textarea></div><div class="actions"><button id="draft" class="btn secondary">Salvar rascunho</button><button id="publish" class="btn primary">Publicar</button></div></aside></div>`;const payload=()=>({scores:Object.fromEntries(Object.keys(names).filter(c=>document.querySelector(`#score-${c}`).value!=='').map(c=>[c,+document.querySelector(`#score-${c}`).value])),comments:Object.fromEntries(Object.keys(names).map(c=>[c,document.querySelector(`#comment-${c}`).value])),mainGuidance:document.querySelector('#guidance').value});document.querySelector('#draft').onclick=()=>save('draft');document.querySelector('#publish').onclick=()=>save('publish');async function save(action){try{await api(`/reviewer/review-requests/${requestId}/${action}`,{method:'POST',headers:{'X-Reviewer-Key':key,'X-Reviewer-Id':id},body:JSON.stringify(payload())});notify(action==='publish'?'Correção publicada.':'Rascunho salvo.');if(action==='publish')setRoute('reviewer')}catch(e){notify(e.message)}}}catch(e){showError(e)}}function showError(e){app.innerHTML=head('Não foi possível carregar','Seu texto não foi descartado.')+`<section class="card"><div class="alert error">${esc(e.message)}</div><button class="btn" onclick="history.back()">Voltar</button></section>`}bootstrap();
</script>
<script>
// Upload documental usa multipart e a transcrição real do backend. O interceptor em
// captura evita que o manipulador de texto crie uma tentativa antes do upload terminar.
document.addEventListener('click',async event=>{
  if(event.target?.id!=='continue'||document.querySelector('#filePane')?.classList.contains('hidden'))return;
  event.preventDefault();event.stopImmediatePropagation();
  const file=document.querySelector('#file')?.files?.[0],theme=document.querySelector('#theme')?.value;
  if(!file||!theme)return notify('Selecione um arquivo e um tema.');
  const form=new FormData();form.append('temaId',theme);form.append('file',file);
  form.append('title',document.querySelector('#title')?.value||'');
  const parent=new URLSearchParams(location.hash.split('?')[1]||'').get('parent');if(parent)form.append('parentEssayId',parent);
  event.target.disabled=true;event.target.textContent='Enviando e transcrevendo…';
  try{const response=await fetch('/api/attempts',{method:'POST',body:form});const data=await response.json();if(!response.ok)throw new Error(data.error||`Erro HTTP ${response.status}`);localStorage.removeItem('redator-draft');setRoute(`inspect/${data.essay.id}`)}catch(error){notify(error.message);event.target.disabled=false;event.target.textContent='Continuar para inspeção'}
},true);

// Melhoria progressiva do upload: usa o limite real do backend e mantém a
// seleção por teclado, acrescentando arrastar/soltar e prévia local.
let uploadPreviewUrl;
function setupUploadUx(){
  const input=document.querySelector('#file'),drop=input?.closest('.drop'),pane=document.querySelector('#filePane');
  if(!input||!drop||drop.dataset.uploadReady)return;drop.dataset.uploadReady='true';
  const limits=document.createElement('p');limits.className='hint';limits.textContent='PDF, PNG ou JPEG · até 8 MB. O backend ainda não impõe limite de páginas para PDF.';drop.append(limits);
  const preview=document.createElement('div');preview.id='filePreview';preview.setAttribute('aria-live','polite');pane.insertBefore(preview,document.querySelector('#transcribed')?.closest('.field'));
  const show=file=>{if(!file)return;if(file.size>8*1024*1024){notify('O arquivo excede o limite de 8 MB.');input.value='';preview.replaceChildren();return}if(document.querySelector('#essayText')?.value.trim())notify('O documento selecionado será usado no lugar do texto digitado neste envio.');document.querySelector('#fileName').textContent=`${file.name} · ${(file.size/1024).toFixed(1)} KB`;if(uploadPreviewUrl)URL.revokeObjectURL(uploadPreviewUrl);uploadPreviewUrl=URL.createObjectURL(file);preview.replaceChildren();if(file.type.startsWith('image/')){const img=document.createElement('img');img.className='file-preview';img.alt=`Prévia de ${file.name}`;img.src=uploadPreviewUrl;preview.append(img)}else if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){const object=document.createElement('object');object.className='file-preview';object.type='application/pdf';object.data=uploadPreviewUrl;object.setAttribute('aria-label',`Prévia de ${file.name}`);object.style.width='100%';object.style.height='300px';preview.append(object)}};
  input.addEventListener('change',()=>show(input.files?.[0]));
  for(const type of ['dragenter','dragover'])drop.addEventListener(type,event=>{event.preventDefault();drop.classList.add('dragging')});
  for(const type of ['dragleave','drop'])drop.addEventListener(type,event=>{event.preventDefault();drop.classList.remove('dragging')});
  drop.addEventListener('drop',event=>{const files=event.dataTransfer?.files;if(!files?.length)return;const transfer=new DataTransfer();transfer.items.add(files[0]);input.files=transfer.files;show(files[0])});
}
const uploadObserver=new MutationObserver(setupUploadUx);uploadObserver.observe(document.querySelector('#app'),{childList:true,subtree:true});setupUploadUx();

// Os checklists pessoais são persistidos, mas não alteram notas nem alegam melhora.
const checklistObserver=new MutationObserver(async()=>{
  if(!location.hash.startsWith('#improve/'))return;
  const essayId=+location.hash.split('/')[1],details=[...document.querySelectorAll('details.competence:not([data-check-ready])')];
  if(!details.length)return;
  details.forEach(d=>d.dataset.checkReady='true');
  let saved=[];try{saved=await api(`/essays/${essayId}/checklist`)}catch{return}
  for(const detail of details){const competence=detail.querySelector('summary')?.textContent?.slice(0,2);if(!competence)continue;const label=document.createElement('label');label.className='hint';const input=document.createElement('input');input.type='checkbox';input.style.width='auto';input.checked=saved.some(x=>x.competence===competence&&x.itemKey==='reviewed'&&Number(x.checked)===1);input.onchange=()=>api(`/essays/${essayId}/checklist`,{method:'PUT',body:JSON.stringify({competence,itemKey:'reviewed',checked:input.checked})}).then(()=>notify('Checklist atualizado.')).catch(e=>notify(e.message));label.append(input,document.createTextNode(' Revisei este ponto (marcação pessoal)'));detail.append(label)}
});
checklistObserver.observe(document.querySelector('#app'),{childList:true,subtree:true});
</script></body></html>
