<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corretor ENEM IA</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1c2430;
      }
      .container {
        max-width: 1000px;
        margin: 48px auto;
        padding: 20px;
      }
      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        padding: 24px;
      }
      h1 { margin-top: 0; }
      form { display: grid; gap: 16px; }
      label { font-weight: 600; }
      textarea, select, button, input { font: inherit; }
      textarea {
        min-height: 180px;
        width: 100%;
        padding: 12px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid #d3d7df;
      }
      button {
        border: none;
        border-radius: 8px;
        background: #244b9a;
        color: white;
        padding: 12px 18px;
        cursor: pointer;
      }
      .secondary {
        background: #e3e9f5;
        color: #243a60;
      }
      .review-panel {
        margin-top: 24px;
        display: none;
        background: #fffaf1;
        border: 1px solid #f2d69b;
        border-radius: 12px;
        padding: 16px;
      }
      .review-layout {
        display: grid;
        grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
        gap: 20px;
        margin-top: 16px;
      }
      .review-document-preview {
        background: #fff;
        border: 1px solid #e8d7a4;
        border-radius: 10px;
        padding: 12px;
        min-height: 160px;
      }
      .review-document-preview img {
        width: 100%;
        max-height: 260px;
        object-fit: contain;
        border-radius: 8px;
        display: block;
      }
      .review-document-preview .doc-meta {
        margin-top: 12px;
        font-size: 0.9rem;
        color: #4b5563;
      }
      .result {
        margin-top: 20px;
        background: #eef5ff;
        border: 1px solid #cfe0ff;
        border-radius: 8px;
        padding: 16px;
      }
      .meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      .badge {
        background: #dfeafc;
        color: #25448d;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 700;
      }
      .quality-box {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #f5f7fc;
        border: 1px solid #dfe5f1;
      }
      .quality-box strong {
        display: block;
        margin-bottom: 6px;
      }
      mark {
        background: #ffe28a;
        color: #1d2b36;
        padding: 0 3px;
        border-radius: 4px;
      }
      .highlight-preview {
        margin-top: 12px;
        padding: 12px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .doc-preview {
        margin-top: 12px;
        display: none;
        background: #f8fafc;
        border: 1px solid #d7e0ef;
        border-radius: 8px;
        padding: 12px;
      }
      .doc-preview img {
        max-width: 100%;
        max-height: 260px;
        border-radius: 8px;
        display: block;
      }
      .review-blocks {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }
      .review-block {
        background: #fff;
        border: 1px solid #dfe7f5;
        border-radius: 10px;
        padding: 12px;
      }
      .review-block.suspicious {
        border-color: #f0c75d;
        background: #fffaf0;
      }
      .review-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 700;
        color: #3b4a63;
      }
      .review-block textarea {
        min-height: 100px;
      }
      .suspicious-pill {
        background: #ffeb99;
        color: #6d4c00;
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Corretor Automatizado de Redações ENEM</h1>
        <form id="essayForm">
          <div>
            <label for="temaId">Tema</label>
            <select id="temaId" name="temaId"></select>
          </div>
          <div>
            <label for="sourceType">Origem da redação</label>
            <select id="sourceType" name="sourceType">
              <option value="text">Texto digitado</option>
              <option value="upload">Upload / revisão humana</option>
            </select>
          </div>
          <div>
            <label for="text">Texto da redação</label>
            <textarea id="text" placeholder="Digite ou cole a redação..." required></textarea>
          </div>
          <div>
            <label for="fileInput">Arquivo auxiliar (opcional)</label>
            <input id="fileInput" type="file" accept=".pdf,image/png,image/jpeg,image/jpg" />
            <div id="docPreview" class="doc-preview" aria-live="polite"></div>
          </div>
          <button type="submit">Enviar para avaliação</button>
        </form>

        <div id="reviewPanel" class="review-panel">
          <h2>Revisão humana</h2>
          <p>O texto precisa ser revisado antes da avaliação quando a origem é upload ou imagem.</p>
          <div id="qualitySummary" class="quality-box">
            <strong>Qualidade da transcrição: aguardando análise</strong>
          </div>

          <div class="review-layout">
            <div id="reviewDocumentPreview" class="review-document-preview" aria-live="polite">
              <div class="doc-meta">Nenhum documento selecionado.</div>
            </div>

            <div>
              <label for="reviewText">Texto revisado</label>
              <textarea id="reviewText" placeholder="Revise o texto antes de aprovar..."></textarea>
              <div id="reviewBlocks" class="review-blocks" aria-live="polite"></div>
              <div id="highlightPreview" class="highlight-preview" aria-live="polite"></div>
            </div>
          </div>

          <div class="meta" style="margin-top: 12px;">
            <button type="button" id="approveReview">Aprovar e avaliar</button>
            <button type="button" class="secondary" id="rejectReview">Rejeitar para revisão</button>
          </div>
        </div>

        <div id="result" class="result" style="display:none;">
          <div class="meta">
            <span id="runBadge" class="badge">RUN</span>
            <span id="total" class="badge">Total: 0</span>
            <span id="review" class="badge">REVISAR</span>
          </div>
          <pre id="resultJson" style="white-space: pre-wrap; margin-top: 16px;"></pre>
        </div>
      </div>
    </div>

    <script>
      const temaSelect = document.getElementById('temaId');
      const form = document.getElementById('essayForm');
      const sourceType = document.getElementById('sourceType');
      const resultBox = document.getElementById('result');
      const resultJson = document.getElementById('resultJson');
      const reviewPanel = document.getElementById('reviewPanel');
      const reviewText = document.getElementById('reviewText');
      const reviewBlocks = document.getElementById('reviewBlocks');
      const fileInput = document.getElementById('fileInput');
      const docPreview = document.getElementById('docPreview');
      const qualitySummary = document.getElementById('qualitySummary');
      const highlightPreview = document.getElementById('highlightPreview');
      const reviewDocumentPreview = document.getElementById('reviewDocumentPreview');
      let currentEssayId = null;
      let selectedDocumentPreview = null;
      let reviewBlocksRefreshTimer = null;

      function escapeHtml(value) {
        return value
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderSuspiciousPreview(text) {
        const escaped = escapeHtml(text || '');
        const highlighted = escaped.replace(/\[[^\]]+\]|\?+|\b(?:qwerty|asdf|zxcv|uiop|lkj|mnbv|poiu|qazwsx|yuiop|zzzz+|[a-z]{8,})\b/gi, '<mark>$&</mark>');
        highlightPreview.innerHTML = highlighted || 'Nenhum token suspeito detectado.';
      }

      function splitReviewTextIntoBlocks(text) {
        const paragraphs = (text || '').split(/\n\s*\n+/).map((block) => block.trim()).filter(Boolean);
        if (paragraphs.length === 0) {
          return [''];
        }

        return paragraphs;
      }

      function renderReviewBlocks() {
        const blocks = splitReviewTextIntoBlocks(reviewText.value);
        reviewBlocks.innerHTML = blocks.map((block, index) => {
          const suspicious = /\[[^\]]+\]|\?+|\b(?:qwerty|asdf|zxcv|uiop|lkj|mnbv|poiu|qazwsx|yuiop|zzzz+)\b/gi.test(block);
          return `
            <div class="review-block ${suspicious ? 'suspicious' : ''}">
              <div class="review-block-header">
                <span>Bloco ${index + 1}</span>
                ${suspicious ? '<span class="suspicious-pill">Trecho suspeito</span>' : ''}
              </div>
              <textarea class="review-block-editor" data-block-index="${index}">${escapeHtml(block)}</textarea>
            </div>
          `;
        }).join('');

        reviewBlocks.querySelectorAll('.review-block-editor').forEach((textarea) => {
          textarea.addEventListener('input', (event) => {
            const index = Number(event.target.dataset.blockIndex);
            const currentBlocks = splitReviewTextIntoBlocks(reviewText.value);
            currentBlocks[index] = event.target.value;
            reviewText.value = currentBlocks.join('\n\n');
            renderSuspiciousPreview(reviewText.value);
            scheduleReviewBlocksRefresh();
          });
        });
      }

      function scheduleReviewBlocksRefresh() {
        if (reviewBlocksRefreshTimer) {
          clearTimeout(reviewBlocksRefreshTimer);
        }

        reviewBlocksRefreshTimer = setTimeout(() => {
          renderReviewBlocks();
        }, 80);
      }

      function renderDocumentPreview(file) {
        if (!file) {
          selectedDocumentPreview = null;
          docPreview.style.display = 'none';
          docPreview.innerHTML = '';
          renderReviewDocumentPreview();
          return;
        }

        const isImage = file.type.startsWith('image/');
        if (isImage) {
          const reader = new FileReader();
          reader.onload = () => {
            selectedDocumentPreview = { type: 'image', src: reader.result, name: file.name };
            docPreview.innerHTML = `<strong>Pré-visualização da imagem</strong><img src="${reader.result}" alt="Pré-visualização da imagem" />`;
            docPreview.style.display = 'block';
            renderReviewDocumentPreview();
          };
          reader.readAsDataURL(file);
          return;
        }

        selectedDocumentPreview = { type: 'pdf', name: file.name };
        docPreview.innerHTML = `<strong>Arquivo PDF</strong><div>${escapeHtml(file.name)}</div>`;
        docPreview.style.display = 'block';
        renderReviewDocumentPreview();
      }

      function renderReviewDocumentPreview() {
        if (!selectedDocumentPreview) {
          reviewDocumentPreview.innerHTML = '<div class="doc-meta">Nenhum documento selecionado.</div>';
          return;
        }

        if (selectedDocumentPreview.type === 'image') {
          reviewDocumentPreview.innerHTML = `
            <img src="${selectedDocumentPreview.src}" alt="Documento da redação" />
            <div class="doc-meta"><strong>Arquivo:</strong> ${escapeHtml(selectedDocumentPreview.name)}</div>
          `;
          return;
        }

        reviewDocumentPreview.innerHTML = `
          <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 8px;">Arquivo PDF</div>
          <div class="doc-meta"><strong>Nome:</strong> ${escapeHtml(selectedDocumentPreview.name)}</div>
          <div class="doc-meta">A transcrição pode ser revisada e editada abaixo.</div>
        `;
      }

      async function refreshQuality(essayId) {
        if (!essayId) return;

        const response = await fetch(`/api/essays/${essayId}/quality`);
        if (!response.ok) return;

        const quality = await response.json();
        const suspicious = quality.tokensSuspeitos?.length ? quality.tokensSuspeitos.join(', ') : 'nenhum';
        qualitySummary.innerHTML = `
          <strong>Qualidade da transcrição: ${quality.qualidade}</strong>
          <div>Palavras: ${quality.palavras} · Linhas: ${quality.linhas} · Ilegíveis: ${quality.ilegiveis}</div>
          <div>Tokens suspeitos: ${suspicious}</div>
        `;
        renderSuspiciousPreview(reviewText.value || '');
      }

      async function loadTemas() {
        const response = await fetch('/api/temas');
        const temas = await response.json();
        temas.forEach((tema) => {
          const option = document.createElement('option');
          option.value = tema.id;
          option.textContent = tema.titulo;
          temaSelect.appendChild(option);
        });
      }

      async function evaluateEssay(essayId) {
        const evaluationResponse = await fetch(`/api/essays/${essayId}/evaluate?profile=cheap`, { method: 'POST' });
        if (!evaluationResponse.ok) {
          const error = await evaluationResponse.text();
          throw new Error(error || 'Avaliação bloqueada');
        }

        const evaluation = await evaluationResponse.json();
        resultBox.style.display = 'block';
        resultJson.textContent = JSON.stringify(evaluation, null, 2);
        document.getElementById('total').textContent = `Total: ${evaluation.total}`;
        document.getElementById('runBadge').textContent = `RUN ${evaluation.runId}`;
        document.getElementById('review').textContent = evaluation.needsReview ? 'REVISAR' : 'OK';
      }

      async function createEssayFromForm() {
        const text = document.getElementById('text').value.trim();

        if (sourceType.value === 'upload') {
          const formData = new FormData();
          formData.append('temaId', String(temaSelect.value));
          if (text) {
            formData.append('text', text);
          }

          const file = fileInput.files && fileInput.files[0];
          if (file) {
            formData.append('file', file, file.name);
          }

          const response = await fetch('/api/essays', {
            method: 'POST',
            body: formData
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.message || 'Não foi possível criar a redação com upload');
          }

          return data.essay;
        }

        const payload = {
          temaId: Number(temaSelect.value),
          text,
          sourceType: sourceType.value
        };

        const response = await fetch('/api/essays', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.message || 'Não foi possível criar a redação');
        }

        return data.essay;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        try {
          const essay = await createEssayFromForm();
          currentEssayId = essay.id;

          if (essay.status === 'NEEDS_REVIEW') {
            reviewText.value = essay.text;
            reviewPanel.style.display = 'block';
            resultBox.style.display = 'none';
            renderReviewDocumentPreview();
            renderReviewBlocks();
            await refreshQuality(essay.id);
            renderSuspiciousPreview(reviewText.value || '');
            return;
          }

          await evaluateEssay(essay.id);
        } catch (error) {
          resultBox.style.display = 'block';
          resultJson.textContent = `Erro: ${error.message}`;
          document.getElementById('total').textContent = 'Total: -';
          document.getElementById('runBadge').textContent = 'ERRO';
          document.getElementById('review').textContent = 'REVISAR';
        }
      });

      reviewText.addEventListener('input', () => {
        renderSuspiciousPreview(reviewText.value || '');
        scheduleReviewBlocksRefresh();
      });

      document.getElementById('approveReview').addEventListener('click', async () => {
        if (!currentEssayId) return;

        const request = {
          reviewedText: reviewText.value.trim(),
          approved: true
        };

        const response = await fetch(`/api/essays/${currentEssayId}/review`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(request)
        });

        if (!response.ok) {
          const text = await response.text();
          resultJson.textContent = `Erro na revisão: ${text}`;
          return;
        }

        await refreshQuality(currentEssayId);
        reviewPanel.style.display = 'none';
        await evaluateEssay(currentEssayId);
      });

      document.getElementById('rejectReview').addEventListener('click', async () => {
        if (!currentEssayId) return;

        const response = await fetch(`/api/essays/${currentEssayId}/review`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reviewedText: reviewText.value.trim(), approved: false })
        });

        if (response.ok) {
          resultBox.style.display = 'block';
          resultJson.textContent = 'Redação enviada para nova revisão humana.';
          document.getElementById('total').textContent = 'Total: -';
          document.getElementById('runBadge').textContent = 'PENDENTE';
          document.getElementById('review').textContent = 'REVISAR';
        }
      });

      sourceType.addEventListener('change', () => {
        fileInput.disabled = sourceType.value !== 'upload';
      });

      fileInput.addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        renderDocumentPreview(file);
      });

      loadTemas();
    </script>
  </body>
</html>
