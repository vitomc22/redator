spring.application.name=corretor-enem
app.data-directory=${REDATOR_DATA_DIR:./data}
spring.datasource.url=jdbc:sqlite:${app.data-directory}/redator.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON;

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080
server.address=127.0.0.1
app.local-api-token.enabled=${REDATOR_LOCAL_API_TOKEN:true}
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

logging.level.root=INFO
logging.level.com.redator.corretor=DEBUG

app.llm.provider=${LLM_PROVIDER:ollama}
app.llm.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
app.llm.ollama.model=${OLLAMA_MODEL:gemma4:e2b-it-q4_K_M}
app.llm.ollama.num-ctx=${OLLAMA_NUM_CTX:8192}
app.llm.ollama.num-predict=${OLLAMA_NUM_PREDICT:1200}
app.llm.ollama.num-thread=${OLLAMA_NUM_THREAD:4}
app.llm.ollama.temperature=${OLLAMA_TEMPERATURE:0}
app.llm.ollama.seed=${OLLAMA_SEED:42}
app.llm.ollama.keep-alive=${OLLAMA_KEEP_ALIVE:5m}
app.llm.ollama.connect-timeout-seconds=${OLLAMA_CONNECT_TIMEOUT_SECONDS:3}
app.llm.ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:600}

# Manifesto do runtime local obrigatório. O digest impede troca silenciosa do modelo.
app.runtime.verify-on-startup=${REDATOR_VERIFY_RUNTIME:true}
app.runtime.auto-pull=${OLLAMA_AUTO_PULL:true}
app.runtime.bootstrap-timeout-seconds=${OLLAMA_BOOTSTRAP_TIMEOUT_SECONDS:1800}
app.runtime.model.tag=${OLLAMA_MODEL:gemma4:e2b-it-q4_K_M}
app.runtime.model.digest=${OLLAMA_MODEL_DIGEST:b37049369adfe3d2b653af0ab301a062ca5cbe96ace6aa0d3f2559ee9b563fc2}
app.runtime.model.quantization=${OLLAMA_MODEL_QUANTIZATION:Q4_K_M}

app.rag.enabled=${RAG_ENABLED:true}
app.rag.require-on-startup=${RAG_REQUIRE_ON_STARTUP:true}
app.rag.database=${RAG_DATABASE:dataset/public-corpus.db}
app.rag.max-examples=${RAG_MAX_EXAMPLES:3}
app.rag.excerpt-chars=${RAG_EXCERPT_CHARS:1200}
app.rag.policy=${RAG_POLICY:lexical-v1}
